# Mosquitto config cho Smart Locker - Nhom 6
# Copy vao /etc/mosquitto/conf.d/smartlocker.conf (setup_mosquitto.sh tu lam viec nay)

# Mosquitto 2.x mac dinh chi nghe localhost -> mo cho cac may khac (Windows/Wokwi) ket noi vao
listener 1883 0.0.0.0

# Bat buoc dang nhap bang user/password
allow_anonymous false
password_file /etc/mosquitto/passwd

# Ghi log de theo doi khi demo: sudo tail -f /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
